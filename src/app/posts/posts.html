<div class="posts-list-container">
    <h2>Últimas Publicaciones</h2>

    <div *ngIf="posts.length === 0" class="loading-message">
        Cargando publicaciones... o no hay publicaciones disponibles
    </div>

    <div *ngFor="let post of posts" class="post-card">
        
        <div class="card-header">
            <h3>{{ post.title }}</h3>
        </div>

        <div class="card-body">
            <p>{{ post.excerpt }}</p>
        </div>

        <div class="card-footer">
            <span class="author">
                Publicado por: <strong>{{ post.author }}</strong>
            </span>
            <span class="timestamp">
                Fecha: {{ post.timestamp | date:'shortDate' }}
            </span>
            
            <button class="btn btn-sm btn-primary">
                Leer más
            </button>
        </div>
    </div>
</div>
