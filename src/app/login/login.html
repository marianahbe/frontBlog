<div class="login-container">
    <h2>Inicio de Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="text" formControlName="email" class="form-control">
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                Ingrese un email válido
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" [type]="passwordVisible ? 'text' : 'password'" formControlName="password" class="form-control">
            <button type="button" 
                class="btn btn-sm btn-toggle" 
                (click)="togglePasswordVisibility()">
            {{ passwordVisible ? 'Ocultar' : 'Mostrar' }}
            </button>
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                La contraseña es obligatoria
            </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">
            Ingresar
        </button>
        <button type="reset" [disabled]="loginForm.invalid" class="btn btn-primary">
            Cancelar
        </button>
    </form>

    <p class="mt-3">
        ¿No tienes una cuenta? <a [routerLink]="['/register']">Regístrate aquí</a>
    </p>
</div>
