<body>
    <div class="login-container">
        <div class="logo">
            <a routerLink="/">
                <img src="/images/Logo-AvanzaTech-Grad-B.svg" alt="Logo avanzatech">
            </a>
        </div>
        <h3>Inicio de Sesión</h3>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="text" formControlName="email" class="form-control">
                <div [class.visible]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="alert">
                    Ingrese un email válido
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" [type]="passwordVisible ? 'text' : 'password'" formControlName="password" class="form-control">
                    <button type="button" 
                        class="btn btn-sm btn-toggle" 
                        (click)="togglePasswordVisibility()">
                            <mat-icon>
                                {{ passwordVisible ? 'visibility_off' : 'visibility' }}
                            </mat-icon>
                    </button>
                <div [class.visible]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="alert">
                    La contraseña es obligatoria
                </div>
            </div>
            <div class="row-buttons">
                <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">
                    Ingresar
                </button>
                <button type="reset" [disabled]="loginForm.invalid" class="btn btn-primary">
                    Cancelar
                </button>
            </div>
        </form>

        <p class="mt-3">
            ¿No tienes una cuenta? <a [routerLink]="['/register']">Regístrate aquí</a>
        </p>
    </div>
</body>
