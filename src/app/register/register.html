<div class="register-container">
    <h2>Registro de Usuario</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input id="username" type="text" formControlName="username" class="form-control">
            <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
                El nombre de usuario es obligatorio
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" formControlName="email" class="form-control">
            <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
                Ingrese un email válido
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" formControlName="password" class="form-control">
            <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
                La contraseña es obligatoria
            </div>
        </div>

        <div class="form-group">
            <label for="passwordConf">Confirmar Contraseña</label>
            <input id="passwordConf" type="password" formControlName="passwordConf" class="form-control">
            <div *ngIf="registerForm.get('passwordConf')?.invalid && registerForm.get('passwordConf')?.touched">
                La confirmación es obligatoria
            </div>
        </div>

        <button type="submit" [disabled]="registerForm.invalid" class="btn btn-primary">
            Registrar
        </button>
    </form>
    <p class="mt-3">
        ¿Ya tienes una cuenta? <a [routerLink]="['/login']">Ingresa aquí</a>
    </p>
</div>
