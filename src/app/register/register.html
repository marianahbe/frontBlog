<body>    
    <div class="register-container">
        <div class="logo">
            <a routerLink="/">
                <img src="/images/Logo-AvanzaTech-Grad-B.svg" alt="Logo avanzatech">
            </a>
        </div>
        <h3>Registro de usuario</h3>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input id="username" type="text" formControlName="username" class="form-control">
                <div [class.visible]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="alert">
                    El nombre de usuario es obligatorio
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" formControlName="email" class="form-control">
                <div [class.visible]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"class="alert">
                    Ingrese un email válido
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-container-relative">
                    <input id="password" [type]="passwordVisible ? 'text' : 'password'" formControlName="password" class="form-control">
                    <button type="button" 
                        class="btn btn-sm btn-toggle" 
                        (click)="togglePasswordVisibility()">
                            <mat-icon>
                                {{ passwordVisible ? 'visibility_off' : 'visibility' }}
                            </mat-icon>
                    </button>
                </div>

                <div [class.visible]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="alert">
                    La contraseña es obligatoria
                </div>
            </div>

            <div class="form-group">
                <label for="passwordConf">Confirmar Contraseña</label>
                <div class="input-container-relative">
                    <input id="passwordConf" [type]="passwordConfVisible ? 'text' : 'password'" formControlName="passwordConf" class="form-control">
                    <button type="button" 
                        class="btn btn-sm btn-toggle" 
                        (click)="togglePasswordConfVisibility()">
                            <mat-icon>
                                {{ passwordConfVisible ? 'visibility_off' : 'visibility' }}
                            </mat-icon>
                    </button>
                </div>

                <div [class.visible]="registerForm.get('passwordConf')?.invalid && registerForm.get('passwordConf')?.touched" class="alert">
                    La confirmación es obligatoria
                </div>
                
            </div>
            <div class="row-buttons">
                <button type="submit" [disabled]="registerForm.invalid" class="btn btn-primary">
                    Registrar
                </button>
                <button type="reset" [disabled]="registerForm.invalid" class="btn btn-primary">
                    Cancelar
                </button>
            </div>
        </form>
        <p class="mt-3">
            ¿Ya tienes una cuenta? <a [routerLink]="['/login']">Ingresa aquí</a>
        </p>
    </div>
</body>
